# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# --- CONFIGURATION MINIMALE QUI MARCHE ---

# Bluetooth de base
CONFIG_ZMK_BLE=y
CONFIG_ZMK_DISPLAY=y

# Split
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# Batterie
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ADC=y

# Nice!View
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n

# Settings
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# --- LE FIX POUR WINDOWS (le seul ajout) ---
CONFIG_BT_CTLR_CONN_PARAM_REQ=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# --- Désactive les features expérimentales ---
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y  # COMMENTE CELLE-CI
# CONFIG_BT_PRIVACY=n  # COMMENTE CELLE-CI
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n  # COMMENTE CELLE-CI

# Active les logs de debug
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y

# Active la console USB
CONFIG_USB_DEVICE_STACK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
