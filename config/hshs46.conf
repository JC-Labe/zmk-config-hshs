# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Bluetooth & Écran ---
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_ZMK_BLE=y
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_PRIVACY=n

# --- Batterie (Le plus important) ---
# On active le reporting, et ZMK trouvera tout seul le capteur du Nice!Nano
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ADC=y
# --- Nice!View ---
# On désactive les widgets moches par défaut
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n

# --- Sécurité (Indispensable) ---
# CONFIG_ENTROPY_GENERATOR=y
# CONFIG_TEST_RANDOM_GENERATOR=y
