# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Bluetooth & Écran ---

CONFIG_ZMK_BLE=y
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_PRIVACY=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- Batterie (Le plus important) ---
# On active le reporting, et ZMK trouvera tout seul le capteur du Nice!Nano
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ADC=y
# --- Nice!View ---
# On désactive les widgets moches par défaut
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n

# --- Sécurité (Indispensable) ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Active le sous-système de configuration de Zephyr (la base de tout)
CONFIG_SETTINGS=y

# Délai avant sauvegarde (en millisecondes).
# Si vous éteignez trop vite après un changement, ça ne sauvegarde pas.
# On met 10 secondes pour être sûr, mais ça sauvegarde dès que c'est stable.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
